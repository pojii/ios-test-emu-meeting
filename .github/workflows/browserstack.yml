name: Build iOS and Upload to BrowserStack

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # อนุญาตให้กดสั่งรันเองได้จากแถบ Actions บน GitHub

jobs:
  build-and-upload:
    name: Build IPA & Upload to BrowserStack
    # macOS 15 + Xcode 16: XcodeGen ล่าสุดสร้างโปรเจกต์ format 77 ซึ่ง Xcode 15.4 เปิดไม่ได้
    runs-on: macos-15
    # ต้องประกาศ env ระดับ job เพราะ if: ของ step อ่าน env ที่ประกาศใน step เดียวกันไม่ได้
    env:
      BS_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
      BS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Show Xcode Version
        run: xcodebuild -version

      - name: 3. Install XcodeGen
        run: brew install xcodegen

      - name: 4. Generate Xcode Project
        run: xcodegen generate

      - name: 5. Build iOS App (Device Build)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MeetUp.xcodeproj \
            -scheme MeetUp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: 6. Package into .ipa
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/MeetUp.app Payload/
          zip -r MeetUp.ipa Payload
          echo "MeetUp.ipa created successfully!"

      - name: 7. Save IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetUp-iOS-App
          path: MeetUp.ipa

      - name: 8. Upload to BrowserStack App Live
        if: env.BS_USER != '' && env.BS_KEY != ''
        run: |
          echo "Uploading to BrowserStack App Live..."
          RESPONSE=$(curl -u "$BS_USER:$BS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@MeetUp.ipa")
          
          echo "Response: $RESPONSE"
          
          # แยกค่า app_url ออกมาแสดงใน GitHub Action Summary
          APP_URL=$(echo $RESPONSE | grep -o '"app_url":"[^"]*' | grep -o '[^"]*$')
          echo "### 🚀 BrowserStack Upload Success!" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: \`$APP_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- คุณสามารถเปิด [BrowserStack App Live](https://app-live.browserstack.com/) เพื่อเลือก iPhone ทดสอบได้ทันที" >> $GITHUB_STEP_SUMMARY
