name: MeetUp
options:
  bundleIdPrefix: com.meetup
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "15.0"

targets:
  MeetUp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeetUp
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.meetup.MeetUp
      SWIFT_VERSION: "5.9"
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_NSCameraUsageDescription: "MeetUp ต้องการเข้าถึงกล้องสำหรับการประชุมทางวิดีโอ"
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "MeetUp ต้องการเข้าถึงไมโครโฟนสำหรับการประชุมทางวิดีโอ"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
